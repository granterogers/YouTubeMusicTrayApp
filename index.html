<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>YTray</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
    }
    #titlebar {
      -webkit-app-region: drag;
      background: #161616;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      border-bottom: 1px solid #2a2a2a;
      border-radius: 8px 8px 0 0;
    }
    .dot { width:10px; height:10px; border-radius:50%; background:#ff4444; flex-shrink:0; }
    #url-bar {
      flex: 1;
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      color: #ccc;
      font-size: 11px;
      padding: 4px 8px;
      outline: none;
      -webkit-app-region: no-drag;
    }
    #url-bar:focus { border-color: #ff4444; }
    .btn {
      -webkit-app-region: no-drag;
      background: #1e1e1e;
      border: 1px solid #333;
      color: #aaa;
      cursor: pointer;
      font-size: 12px;
      padding: 3px 7px;
      border-radius: 4px;
      transition: all 0.1s;
      flex-shrink: 0;
    }
    .btn:hover { color:#fff; background:#2a2a2a; border-color:#555; }
    .btn.active { color:#ff4444; border-color:#ff4444; }
    #hint {
      background: #111;
      border-bottom: 1px solid #1e1e1e;
      padding: 3px 10px;
      font-size: 10px;
      color: #3a3a3a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    kbd {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 3px;
      padding: 0 4px;
      font-size: 9px;
      color: #555;
    }
    #wv-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      border-radius: 0 0 8px 8px;
    }
    webview {
      width: 100%;
      height: 100%;
      display: flex;
    }
    #bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: #ff4444;
      transform-origin: left;
      transform: scaleX(0);
      z-index: 10;
      transition: opacity 0.3s;
    }
    #bar.loading { animation: load 1.8s ease infinite; }
    @keyframes load {
      0%   { transform: scaleX(0);   opacity: 1; }
      60%  { transform: scaleX(0.8); opacity: 1; }
      100% { transform: scaleX(1);   opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="titlebar">
    <div class="dot"></div>
    <input id="url-bar" type="text" value="https://music.youtube.com" spellcheck="false" />
    <button class="btn" id="btn-back"   title="Back">◀</button>
    <button class="btn" id="btn-fwd"    title="Forward">▶</button>
    <button class="btn" id="btn-reload" title="Reload">↺</button>
    <button class="btn" id="btn-play"   title="Play/Pause">⏯</button>
    <button class="btn" id="btn-pin"    title="Pin window">📌</button>
  </div>
  <div id="hint">
    <span>⏯ <kbd>Ctrl+Alt+Space</kbd> &nbsp; ⏭ <kbd>Ctrl+Alt+→</kbd> &nbsp; ⏮ <kbd>Ctrl+Alt+←</kbd></span>
    <span id="status">⏸</span>
  </div>
  <div id="wv-wrap">
    <div id="bar"></div>
    <webview id="wv"
      src="https://music.youtube.com"
      partition="persist:ytray"
      allowpopups="true"
      useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36">
    </webview>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const wv     = document.getElementById('wv');
    const urlBar = document.getElementById('url-bar');
    const bar    = document.getElementById('bar');
    const status = document.getElementById('status');
    const btnPin = document.getElementById('btn-pin');
    let pinned = false;

    // ── Navigation ──────────────────────────────────────────────────────────
    urlBar.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      let url = urlBar.value.trim();
      if (!url.startsWith('http')) url = 'https://' + url;
      wv.src = url;
    });

    wv.addEventListener('did-navigate',         e => urlBar.value = e.url);
    wv.addEventListener('did-navigate-in-page', e => urlBar.value = e.url);
    wv.addEventListener('did-start-loading',    () => bar.classList.add('loading'));
    wv.addEventListener('did-stop-loading',     () => bar.classList.remove('loading'));

    document.getElementById('btn-back').onclick   = () => wv.goBack();
    document.getElementById('btn-fwd').onclick    = () => wv.goForward();
    document.getElementById('btn-reload').onclick = () => wv.reload();

    // ── Play/Pause ──────────────────────────────────────────────────────────
    const PLAY_JS = `(function(){
      const v = document.querySelector('video');
      if (v) { v.paused ? v.play() : v.pause(); return !v.paused; }
      document.dispatchEvent(new KeyboardEvent('keydown',{ key:'k', keyCode:75, bubbles:true }));
      return null;
    })()`;

    function togglePlay() {
      wv.executeJavaScript(PLAY_JS)
        .then(p => { if (p !== null) status.textContent = p ? '▶' : '⏸'; })
        .catch(() => {});
    }

    document.getElementById('btn-play').onclick = togglePlay;
    ipcRenderer.on('toggle-play', togglePlay);

    // ── Pin ──────────────────────────────────────────────────────────────────
    btnPin.onclick = () => {
      pinned = !pinned;
      btnPin.classList.toggle('active', pinned);
      ipcRenderer.send('pin-changed', pinned);
    };

    // ── Navigate from tray menu ──────────────────────────────────────────────
    ipcRenderer.on('navigate', (e, url) => {
      wv.src = url;
      urlBar.value = url;
    });

    // ── Poll play state every 3s ─────────────────────────────────────────────
    setInterval(() => {
      wv.executeJavaScript('(()=>{ const v=document.querySelector("video"); return v?!v.paused:null; })()')
        .then(p => { if (p !== null) status.textContent = p ? '▶' : '⏸'; })
        .catch(() => {});
    }, 3000);
  </script>
</body>
</html>
